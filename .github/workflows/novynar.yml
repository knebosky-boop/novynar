name: Новинар

on:
  schedule:
    - cron: "0 */3 * * *"        # рятівний будильник раз на 3 години
  workflow_dispatch:

concurrency:
  group: novynar
  cancel-in-progress: false

jobs:
  obhid:
    name: Обхід каналів
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Чи не працює вже інша зміна
        id: guard
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          n=$(gh api "repos/${{ github.repository }}/actions/workflows/novynar.yml/runs?status=in_progress" -q '.workflow_runs | length')
          if [ "$n" -gt 1 ]; then
            echo "вже працює інша зміна ($n) — лягаю спати"
            echo "go=no" >> $GITHUB_OUTPUT
          else
            echo "go=yes" >> $GITHUB_OUTPUT
          fi

      - uses: actions/checkout@v5
        if: steps.guard.outputs.go == 'yes'

      - uses: actions/setup-python@v6
        if: steps.guard.outputs.go == 'yes'
        with:
          python-version: "3.11"
          cache: pip

      - name: Залежності
        if: steps.guard.outputs.go == 'yes'
        run: pip install -q -r requirements.txt

      - name: Згадати, на чому спинились
        if: steps.guard.outputs.go == 'yes'
        uses: actions/cache/restore@v5
        with:
          path: novynar.db
          key: novynar-db-${{ github.run_id }}
          restore-keys: novynar-db-

      - name: Зміна на 18 хвилин — обхід кожні 2 хвилини
        if: steps.guard.outputs.go == 'yes'
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          NOVYNAR_OWNER: ${{ secrets.NOVYNAR_OWNER }}
          NOVYNAR_READERS: ${{ secrets.NOVYNAR_READERS }}
          NOVYNAR_MIRROR_KEY: ${{ secrets.NOVYNAR_MIRROR_KEY }}
          NOVYNAR_MIRROR_HOST: ${{ secrets.NOVYNAR_MIRROR_HOST }}
          NOVYNAR_MIRROR_HOSTKEY: ${{ secrets.NOVYNAR_MIRROR_HOSTKEY }}
          TZ: Europe/Kyiv
        run: python novynar.py --loop-minutes 18

      - name: Запам'ятати
        if: always() && steps.guard.outputs.go == 'yes'
        uses: actions/cache/save@v5
        with:
          path: novynar.db
          key: novynar-db-${{ github.run_id }}

      - name: Розбудити наступну зміну
        if: always() && steps.guard.outputs.go == 'yes'
        env:
          GH_TOKEN: ${{ secrets.WORKFLOW_PAT }}
        # Збій GitHub на цьому кроці рве ланцюг до рятівного cron (06.10 і 07.10.2026 — до 2 год тиші):
        # не здаємось з першої спроби, пауза 15/30/45/60 с.
        run: |
          for i in 1 2 3 4 5; do
            gh workflow run novynar.yml -R ${{ github.repository }} && exit 0
            [ "$i" -lt 5 ] && { echo "::warning::розбудити наступну зміну: спроба $i не вдалась, повтор за $((i*15)) с"; sleep $((i*15)); }
          done
          exit 1

      - name: Журнал
        if: always() && steps.guard.outputs.go == 'yes'
        run: tail -40 novynar.log || true
